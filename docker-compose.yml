version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: grc_postgres
    restart: always
    environment:
      POSTGRES_USER: grc_user
      POSTGRES_PASSWORD: grc_password
      POSTGRES_DB: cognitive_grc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc_user -d cognitive_grc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grc_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grc_backend
    restart: always
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://grc_user:grc_password@db:5432/cognitive_grc
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-replace_this_with_a_secure_random_hex_key_for_development}
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - ENABLE_DOCS=true
      # Reach the host's Ollama from inside the container. `localhost` here would
      # be the container itself, so we target the Docker host gateway instead.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      # Make host.docker.internal resolvable on Linux too (built-in on Docker Desktop).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grc_frontend
    restart: always
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
